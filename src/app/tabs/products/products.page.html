<ion-content>

  <div class="product-list-container" *ngIf="!wantMoreInfo else moreProductInfo">

    <div class="header">
      <img (click)="goToMainPage()" class="main-img" src="assets/3CO/3_CO_sin_letras.png" alt="3-CO">
      <ion-chip (click)="goToProfile()">
        <ion-avatar>
          <img [src]="user.avatarImg" alt="3-CO">
        </ion-avatar>
        <ion-text>
          {{user.name}}
        </ion-text>
      </ion-chip>
    </div>

    <div class="products-scroll-content">

      <div class="title-container">
        <ion-text color="secondary">
          <h2>{{"product.engage"|translate}}</h2>
        </ion-text>
      </div>

      <div class="scan-container">
        <div id="scan-banner">
          <ion-text style="color: white;">
            <p>{{"product.search_post"|translate}}</p>
          </ion-text>
        </div>
        <ion-button color="primary" shape="round" (click)="postNewProduct()">{{"product.post"|translate}}</ion-button>
      </div>

      <div class="serch-filter-container">
        <div class="searchbar-filter">
          <ion-searchbar placeholder="Search product" [debounce]="700"
            (ionInput)="handleSearchBarInput($event)"></ion-searchbar>
          <ion-button fill="outline" color="secondary" shape="round" (click)="toggleFilter()">
            <ion-icon slot="icon-only" name="filter-outline"></ion-icon>
          </ion-button>
        </div>
      </div>


      <div class="recently-added-container">
        <ion-text color="primary">
          <h5 class="no-padding">{{"product.recently"|translate}}</h5>
        </ion-text>
      </div>

      <!-- recently added products -->
      <ion-list>

        <ng-container *ngFor="let product of products">

          <app-single-product (click)="showProductInfo(product)" [product]="product"></app-single-product>

        </ng-container>

      </ion-list>

      <ion-infinite-scroll (ionInfinite)="loadMore($event)">
        <ion-infinite-scroll-content loadingText="Loading more Products...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>



    </div>

  </div>

</ion-content>


<ng-template #moreProductInfo>
  <app-product-info [product]="selectedProduct" [currentUser]="user" (wannaGoBack)="closeMoreInfo()"></app-product-info>
</ng-template>



<ion-modal #modal [isOpen]="isModalOpen" (ionModalDidDismiss)="onWillDismiss($event)" [initialBreakpoint]="1"
  [breakpoints]="[0, 1]">
  <ng-template>

    <div class="ion-modal-block">
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button color="medium" (click)="clearFilters()">{{"product.clear"|translate}}</ion-button>
          </ion-buttons>
          <ion-title>{{"product.filters"|translate}}</ion-title>
          <ion-buttons slot="end">
            <ion-button color="primary" (click)="applyFilters()">{{"product.apply"|translate}}</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <div class="filter-container">
        <ion-text>
          <h4><strong>{{"categories"|translate}}</strong></h4>
        </ion-text>
        <div class="categories-container">
          <ion-chip *ngFor="let category of categories"
            [ngClass]="{'selected': selectedCategories.includes(category.name)}"
            (click)="toggleSelection(category.name)">
            <ion-icon [name]="category.icon"></ion-icon>
            <ion-text>{{category.name}}</ion-text>
          </ion-chip>
        </div>
      </div>

    </div>

  </ng-template>
</ion-modal>
